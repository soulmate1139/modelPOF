<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>POF Admin — Applications</title>
  <link rel="stylesheet" href="css/admin.css" />
</head>
<body>

  <!-- ── Login screen ──────────────────────────────────── -->
  <div class="login-overlay" id="login-screen">
    <div class="login-card">
      <div class="login-logo">
        <img src="icon.png" alt="POF" />
        <span>POF Admin</span>
      </div>
      <h2>Sign in</h2>
      <p class="login-sub">Model enrollment dashboard</p>

      <div class="field">
        <label for="adminEmail">Email</label>
        <input type="email" id="adminEmail" placeholder="admin@example.com" autocomplete="email" />
      </div>
      <div class="field">
        <label for="adminPassword">Password</label>
        <input type="password" id="adminPassword" placeholder="••••••••" autocomplete="current-password" />
      </div>

      <div class="login-alert" id="login-alert"></div>
      <button class="btn-signin" id="login-btn" onclick="doLogin()">Sign In</button>
    </div>
  </div>

  <!-- ── Dashboard ─────────────────────────────────────── -->
  <div class="dashboard" id="dashboard" style="display:none">

    <header class="dash-header">
      <div class="dash-logo">
        <img src="icon.png" alt="POF" />
        <span>Model Applications</span>
      </div>
      <button class="btn-signout" onclick="doLogout()">Sign Out</button>
    </header>

    <main class="dash-main">

      <!-- Stats -->
      <div class="stats-row">
        <div class="stat-card">
          <div class="stat-num" id="count-all">0</div>
          <div class="stat-label">Total</div>
        </div>
        <div class="stat-card stat-pending">
          <div class="stat-num" id="count-pending">0</div>
          <div class="stat-label">Pending</div>
        </div>
        <div class="stat-card stat-approved">
          <div class="stat-num" id="count-approved">0</div>
          <div class="stat-label">Approved</div>
        </div>
        <div class="stat-card stat-rejected">
          <div class="stat-num" id="count-rejected">0</div>
          <div class="stat-label">Rejected</div>
        </div>
      </div>

      <!-- Filter tabs -->
      <div class="filter-bar">
        <button class="filter-btn active" data-filter="all"      onclick="setFilter('all')">All</button>
        <button class="filter-btn"        data-filter="pending"  onclick="setFilter('pending')">Pending</button>
        <button class="filter-btn"        data-filter="approved" onclick="setFilter('approved')">Approved</button>
        <button class="filter-btn"        data-filter="rejected" onclick="setFilter('rejected')">Rejected</button>
      </div>

      <!-- Table -->
      <div class="table-wrap">
        <table class="app-table">
          <thead>
            <tr>
              <th>Name</th>
              <th>Email</th>
              <th>Phone</th>
              <th>Submitted</th>
              <th>Status</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="applications-body">
            <tr><td colspan="6" class="empty-row">Loading…</td></tr>
          </tbody>
        </table>
      </div>

    </main>
  </div>

  <!-- ── Detail modal ───────────────────────────────────── -->
  <div class="modal-overlay" id="modal-overlay" style="display:none">
    <div class="modal-card" id="modal-card">
      <button class="modal-close" onclick="closeModal()">&#x2715;</button>
      <div id="modal-content"></div>
    </div>
  </div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="js/firebase.js"></script>
  <script src="admin.js"></script>
</body>
</html>
